                              - config_type
                              properties:
                                name:
                                  type: string
                                  example: RDBMS_PASSWORD
                                config_type:
                                  type: string
                                  example: KEYVAULT
                                  enum:
                                  - KEYVAULT
                                  - ADMIN
                                config_name:
                                  type: string
                                  example: iw_admin_conf
                                secret_id:
                                  type: string
                                  example: e77850ad5127a2d7dab870ff
