                            example: /opt/infoworks/drivers
                          upload_option:
                            type: string
                            enum:
                            - fileUpload
                            - serverLocation
                            example: fileUpload
                          file_details:
                            type: array
                            items:
                              type: object
                              properties:
                                file_name:
                                  type: string
                                  example: terajdbc4.jar
                                file_path:
                                  type: string
                                  example: /opt/infoworks/lib/ingestion/drivers/test/terajdbc4.jar
