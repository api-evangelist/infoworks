openapi: 3.2.0
info:
  contact: {}
  title: Infoworks Rest API V3 Jobs API
  version: '1.0'
  description: Infoworks Rest API V3
servers:
- url: '{protocol}://{host}:{port}/v3'
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost
    port:
      default: '3001'
tags:
- name: Jobs
  description: ''
paths:
  /admin/jobs:
    get:
      security:
      - BearerAuth: []
      operationId: getJobs
      tags:
      - Jobs
      summary: Get the jobs details
      description: Get the jobs details
      parameters:
      - name: limit
        in: query
        description: The numbers of items to return
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: Filter results query
        schema:
          type: string
      - name: resolve_ref
        in: query
        description: To get entity details and created by user name
        schema:
          type: boolean
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    limit:
                      type: integer
                      example: 10
                    offset:
                      type: integer
                      example: 0
                    links:
                      type: object
                      properties:
                        base:
                          type: string
                          format: uri
                          example: https://localhost:3001/v3/{admin/{workflows/{| |runs|tasks}|cluster-templates|jobs|admin-jobs|users}|sources|pipelines|cubes|domains}
                        self:
                          type: string
                          format: uri
                          example: https://localhost:3001/v3/{admin/{workflows/{| |runs|tasks}|cluster-templates|jobs|admin-jobs|users}|sources|pipelines|cubes|domains}?limit=10&offset=0
                        next:
                          type: string
                          format: uri
                          example: https://localhost:3001/v3/{admin/{workflows/{| |runs|tasks}|cluster-templates|jobs|admin-jobs|users}|sources|pipelines|cubes|domains}?limit=10&offset=10
                    total_count:
                      type: integer
                      example: 10
                  x-examples:
                    example-1: {}
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - type: object
                  properties:
                    result:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 8714887c9a8c5bb0b8794811
                          build_id:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: test_job
                          status:
                            type: string
                            enum:
                            - completed
                            - pending
                            - aborted
                            - blocked
                            - failed
                            - running
                            - canceled
                            - succeeded
                            example: completed
                          percentage:
                            type: integer
                            example: 100
                          type:
                            type: string
                            enum:
                            - source_test_connection
                            - fetch_metadata
                            - source_structured_fetch_metadata
                            - source_crawl
                            - source_crawl_chunk_load
                            - source_cdc
                            - source_unstructured_crawl
                            - source_structured_crawl
                            - source_semistructured_crawl
                            - delete_entity
                            - pipeline_metadata
                            - pipeline_build
                            - pipeline_build_restatement
                            - full_load
                            - cdc
                            - source_merge
                            - source_structured_cdc_merge
                            - source_structured_cdc
                            - source_cdc_merge
                            - source_cdc_restatement
                            - source_semistructured_cdc_merge
                            - source_semistructured_cdc
                            - metadata_cleanup_policy
                          entity_id:
                            type: string
                            example: d2f33c1d424363162692b3bf
                          entity_type:
                            type: string
                            enum:
                            - source
                            - pipeline
                            - workflow
                          sub_entity_id:
                            type: string
                            example: be034607444511f74313be63
                          sub_entity_type:
                            type: string
                            example: table_group
                          duration:
                            type: integer
                            example: 349316
                            description: This is duration of the job.
                          cluster_id:
                            type: string
                            example: j-134jnasdkjaasd
                            description: Extenal clusterId
                          compute_id:
                            type: string
                            example: be034607444511f74313be63
                            description: Infoworks compute cluster id
                          compute_name:
                            type: string
                            example: Default_Persistent_cluster
                            description: Infoworks compute name
                          created_at:
                            type: string
                            format: date-time
                            example: '2020-10-05T04:23:30.339Z'
                          created_by:
                            type: string
                            example: 6RkfybTRQQByEey3v
                            description: UserId of user who triggered the job.
                          last_updated:
                            type: string
                            example: '2019-11-21T12:54:05.875Z'
                          processed_at:
                            type: string
                            example: '2019-11-21T12:54:05.875Z'
        '400':
          description: Request has invalid body or parameters.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10006
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10006
        '401':
          description: Authentication Failed. Please check your Credentials
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
