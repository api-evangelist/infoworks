openapi: 3.2.0
info:
  contact: {}
  title: Infoworks Rest API V3 Workflow Versions API
  version: '1.0'
  description: Infoworks Rest API V3
servers:
- url: '{protocol}://{host}:{port}/v3'
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost
    port:
      default: '3001'
tags:
- name: Workflow Versions
  description: Workflow Versions CRUD Operations
paths:
