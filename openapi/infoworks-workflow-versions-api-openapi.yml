      - name: domain_id
        in: path
        required: true
        schema:
          type: string
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          example: f132c1fa46e1e7f8fb1cf566
      - name: offset
        in: query
        description: The number of items to skip before starting to collect the result set
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The numbers of items to return
        schema:
          type: integer
          default: 10
      - name: sort_by
        in: query
        description: Sort result on field
        schema:
          type: string
      - name: order_by
        in: query
        description: order  ascending | descending
        schema:
          type: string
          default: asc
