      tags:
      - Streaming
      summary: Add/Edit Configuration for streaming options of a table group.
      description: Add/Edit Configuration for streaming options of a table group.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - enabled
                  - disabled
                engine:
                  type: object
                  properties:
                    name:
                      type: string
                      enum:
                      - spark
                    master:
                      type: string
                      enum:
                      - yarn
                      - standalone
                    deploy_mode:
                      type: string
                      enum:
                      - client
                      - cluster
                topic_identifier:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - list
                      - regex
                    value:
                      type: string
                streaming_frequency:
                  type: string
                  enum:
                  - minutes
                  - hours
                  - days
                streaming_value:
                  type: integer
                record_type:
                  type: object
                  properties:
                    name:
                      type: string
                      example: delimited
                    column_separator:
                      type: string
                    column_enclosed_by:
                      type: string
                    escape_character:
                      type: string
                    character_encoding:
                      type: string
                      enum:
                      - utf-8
                      - ascii
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                      id:
                        type: string
        '400':
          description: Bad Request
          content:
