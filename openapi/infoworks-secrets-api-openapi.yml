                              properties:
                                name:
                                  type: string
                                  example: azure key vault
                                description:
                                  type: string
                                  example: azure key vault
                                secret_store:
                                  type: string
                                  example: 5fad039f7758f33e0e83ef82
                                secret_store_service_type:
                                  type: string
                                  description: This field is returned only when `resolve_ref` is set to `true`
                                  enum:
