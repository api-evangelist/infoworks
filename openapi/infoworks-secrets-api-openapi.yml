                      type: integer
                      example: 10
                  x-examples:
                    example-1: {}
                - type: object
                  properties:
                    result:
                      type: array
                      items:
                        oneOf:
                        - allOf:
                          - allOf:
                            - type: object
                              properties:
                                id:
                                  type: string
                                  example: e77850ad5127a2d7dab870ff
