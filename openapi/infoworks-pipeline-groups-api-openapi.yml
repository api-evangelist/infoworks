                  snowflake_profile:
                    type: string
                    example: profile1
                  snowflake_warehouse:
                    type: string
                    example: warehouse_snowflake
                  data_environment:
                    type: string
                    example: environment_abc
                  compute_cluster:
                    type: string
                    example: environment_persistent
                  batch_engine:
                    type: string
                    example: azure
                  pipelines:
                    type: array
