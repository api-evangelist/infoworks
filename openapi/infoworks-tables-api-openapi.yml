                  comment_up_to_char_array:
                    type: array
                    items:
                      type: integer
                      example: 6
                    description: This is required in case the recordType field is  Variable Length Custom Header(VCH) or Variable Block Custom Header(VBCH)
                  comment_after_char_array:
                    type: array
                    items:
                      type: integer
                      example: 72
