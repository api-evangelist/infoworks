                  configuration:
                    type: object
                    required:
                    - should_flatten_fields
                    - comment_policy_up_to_char
                    - comment_policy_after_char
                    - record_type
                    - file_encoding
                    - charset
                    - sync_type
                    - target_table_name
                    - include_subdirectories
                    - file_header_bytes
                    - file_footer_bytes
                    - include_filename_regex
                    - source_relative_path
                    properties:
                      should_flatten_fields:
                        type: boolean
                        example: true
                      comment_policy_up_to_char:
                        type: integer
                        example: 6
                      comment_policy_after_char:
                        type: integer
                        example: 72
                      record_type:
                        type: string
                        example: VB
