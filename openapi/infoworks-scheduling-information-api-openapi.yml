      - name: entity_id
        in: query
        description: Entity ID
        required: false
        schema:
          type: string
      - name: entity_type
        in: query
        description: Entity Type
        required: true
        schema:
          type: string
          enum:
          - workflow
          - metadata_cleanup_policy
          - system_config
          - table_group
          - table
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - type: object
                  properties:
                    result:
                      type: array
                      items:
                        type: object
                        properties:
                          entity_id:
                            type: string
                            example: e77850ad5127a2d7dab870ff
                          schedule_type:
                            type: string
                            enum:
                            - workflow-build
                            - metadata_cleanup
                            - mongo-backup
                            - table-group-cdc
                            - table
                          schedule_username:
                            type: string
                            example: admin@infoworks.io
                          schedule_details:
                            allOf:
                            - oneOf:
                              - type: object
                                title: Generic Schedule
                                description: Generic schedule object
                                required:
                                - schedule_status
                                properties:
                                  schedule_status:
                                    type: string
                                    enum:
                                    - enabled
                                    - disabled
                                    example: enabled
                                  start_date:
                                    pattern: ^[1-12]{1}/[0-31]{1}/\d{4}$
                                    type: string
                                    description: Start time should be after current time.
                                    format: date-month'/'date-mday'/'date-fullyear
                                    example: 08/28/2023
                                  start_hour:
                                    type: integer
                                    minimum: 0
                                    maximum: 23
                                    example: 14
                                  start_min:
                                    type: integer
                                    minimum: 0
                                    maximum: 59
                                    example: 35
                                  repeat_interval_unit:
                                    type: string
                                    enum:
                                    - NEVER
                                    - MINUTE
                                    - HOUR
                                    - DAY
                                    - WEEK
                                    - MONTH
                                    default: NEVER
                                    example: MONTH
                                  repeat_interval_measure:
                                    type: integer
                                    minimum: 1
                                  repeat_on_last_day:
                                    type: boolean
                                    description: '`specified_days` must be provided if `repeat_on_last_day` is false. Applicable for `repeat_interval_unit=MONTH`

                                      '
                                    default: false
                                  specified_days:
                                    type: array
                                    description: 'Applicable when `repeat_interval_unit` is `WEEK` or `MONTH`.

                                      '
                                    minLength: 1
                                    items:
                                      type: integer
                                      minimum: 0
                                      maximum: 31
                                    example:
                                    - 1
                                    - 17
                                    - 31
                                  ends:
                                    type: boolean
                                    description: '`end_date`, `end_hour`, `end_min` must be provided if `ends` is `true`.

                                      '
                                    default: false
                                    example: true
                                  end_date:
                                    pattern: ^[1-12]{1}/[0-31]{1}/\d{4}$
                                    type: string
                                    description: End time should be after start time.
                                    format: date-month'/'date-mday'/'date-fullyear
                                    example: 08/28/2023
                                  end_hour:
                                    type: integer
                                    minimum: 0
                                    maximum: 23
                                    example: 15
                                  end_min:
                                    type: integer
