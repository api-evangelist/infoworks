                      description: Generic schedule object
                      required:
                      - schedule_status
                      properties:
                        schedule_status:
                          type: string
                          enum:
                          - enabled
                          - disabled
                          example: enabled
                        start_date:
                          pattern: ^[1-12]{1}/[0-31]{1}/\d{4}$
