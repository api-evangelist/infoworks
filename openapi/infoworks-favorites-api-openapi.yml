    patch:
      security:
      - BearerAuth: []
      tags:
      - Favorites
      summary: Toggle entity favorite tag
      description: Toggle entity favorite tag
      parameters:
      - name: entity_id
        in: query
        description: Entity ID
        required: true
        schema:
          type: string
      - name: entity_type
        in: query
