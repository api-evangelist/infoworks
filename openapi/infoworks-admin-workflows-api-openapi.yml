  /admin/workflows:
    get:
      security:
      - BearerAuth: []
      summary: Retrieves the status of workflow
      description: Retrieves the status of workflows for the Admin user.
      operationId: getAdminWorkflows
      tags:
      - Admin Workflows
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    limit:
                      type: integer
                      example: 10
                    offset:
                      type: integer
                      example: 0
                    links:
                      type: object
                      properties:
                        base:
                          type: string
                          format: uri
                          example: https://localhost:3001/v3/{admin/{workflows/{| |runs|tasks}|cluster-templates|jobs|admin-jobs|users}|sources|pipelines|cubes|domains}
                        self:
                          type: string
                          format: uri
                          example: https://localhost:3001/v3/{admin/{workflows/{| |runs|tasks}|cluster-templates|jobs|admin-jobs|users}|sources|pipelines|cubes|domains}?limit=10&offset=0
                        next:
                          type: string
                          format: uri
                          example: https://localhost:3001/v3/{admin/{workflows/{| |runs|tasks}|cluster-templates|jobs|admin-jobs|users}|sources|pipelines|cubes|domains}?limit=10&offset=10
                    total_count:
                      type: integer
                      example: 10
                  x-examples:
                    example-1: {}
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - properties:
                    result:
                      type: object
                      properties:
                        total_count:
                          type: integer
                          minimum: 0
                          description: Total count of workflows
                          example: 10
                        items:
                          type: array
                          items:
                            type: object
                            allOf:
                            - type: object
                              properties:
                                created_by:
                                  type: string
                                  example: 6RkfybTRQQByEey3v
                            - properties:
                                created_by_user_email:
                                  type: string
                                  description: User email
                                  example: admin@infoworks.io
                                created_by_user_name:
                                  type: string
                                  description: User name
                                  example: Infoworks Admin
                                domain_id:
                                  type: string
                                  example: e77850ad5127a2d7dab870ff
                                domain_name:
                                  type: string
                                  description: Domain name
                                is_paused:
                                  type: boolean
                                  example: false
                                last_exec_end_time:
                                  type: string
                                  example: '2022-06-14 07:55:57.334000+00:00'
                                last_exec_start_time:
                                  type: string
                                  example: '2022-06-14 07:55:55.549158+00:00'
                                last_exec_status:
                                  type: string
                                  example: success
                                workflow_id:
                                  type: string
                                  example: e77850ad5127a2d7dab870ff
                                workflow_name:
                                  type: string
                                  example: new_workflow
        '400':
          description: Request has invalid body or parameters.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10006
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10006
        '401':
          description: Authentication Failed. Please check your Credentials
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
