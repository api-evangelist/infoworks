      operationId: pauseMultipleWorkflows
      tags:
      - Admin Workflows
      summary: Pause Multiple Workflows
      description: Pause Multiple Workflows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - workflows
              properties:
                workflows:
                  type: array
                  description: List of workflows and their versions to pause or resume.
                  items:
                    type: object
                    required:
                    - workflow_id
                    - workflow_version_id
                    properties:
                      workflow_id:
                        type: string
                        example: e77850ad5127a2d7dab870ff
                      workflow_version_id:
                        type: string
                        example: e77850ad5127a2d7dab870ff
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - properties:
                    result:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Summary message of the operation.
                          example: Successfully Resumed Workflow
                        result:
                          type: array
                          description: List of resumed workflows with their versions.
                          items:
                            type: object
                            required:
                            - workflow_id
                            - workflow_version_id
                            properties:
                              workflow_id:
                                type: string
                                example: e77850ad5127a2d7dab870ff
                              workflow_version_id:
                                type: string
                                example: e77850ad5127a2d7dab870ff
        '400':
          description: Request has invalid body or parameters.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10006
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10006
        '401':
          description: Authentication Failed. Please check your Credentials
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
