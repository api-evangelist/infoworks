                    total_count:
                      type: integer
                      example: 10
                  x-examples:
                    example-1: {}
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - properties:
                    result:
                      type: array
                      description: List of workflow version objects.
                      items:
                        type: object
                        properties:
                          workflow_id:
                            type: string
                            description: Unique ID of the parent workflow.
                            example: 686e20a16f25c44e155ba21d
                          version:
                            type: integer
                            description: Version number of the workflow.
                            example: 1
                          last_execution_details:
                            type: object
                            properties:
                              run_id:
                                type: string
                                description: ID of the last workflow execution run.
                                example: 686e24e46f25c44e155ba227
                              start_date:
                                type: string
                                format: date-time
                                description: Start time of the last execution.
                                example: '2025-07-09T08:14:29.498325+00:00'
                              end_date:
                                type: string
                                format: date-time
                                description: End time of the last execution.
                                example: '2025-07-09T08:14:33.119Z'
                              status:
                                type: string
                                description: Status of the last execution.
                                example: success
                          is_paused:
                            type: boolean
                            description: Indicates if the workflow version is paused.
                            example: true
                          domain_id:
                            type: string
                            example: e77850ad5127a2d7dab870ff
                          domain_name:
                            type: string
                            description: Name of the domain to which the workflow belongs.
                            example: Data_Engineering
                          workflow_name:
                            type: string
                            description: Name of the workflow.
                            example: w1
                          workflow_version_id:
                            type: string
                            description: Unique ID of the workflow version.
                            example: 686e20a16f25c44e155ba220
                          created_by_username:
                            type: string
                            description: Name of the user who created the workflow version.
                            example: Infoworks Admin
        '400':
          description: Request has invalid body or parameters.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
