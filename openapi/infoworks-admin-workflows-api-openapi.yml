  /admin/workflow-versions:
    get:
      security:
      - BearerAuth: []
      summary: Gets workflow versions
      description: Retrieves the list of workflow versions for the Admin user.
      operationId: getAdminWorkflowVersions
      tags:
      - Admin Workflows
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    limit:
                      type: integer
                      example: 10
                    offset:
                      type: integer
                      example: 0
                    links:
                      type: object
