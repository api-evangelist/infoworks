                  type: string
                  example: new-generic-source
                  pattern: ^[a-z0-9A-Z_-]+$
                driver_class_name:
                  type: string
                  example: test.genric.driver
                upload_option:
                  type: string
                  example: fileUpload
                files:
                  description: Required files if upload_option is fileUpload
                  type: string
                  format: binary
                  example: driver.jar
                folder_path:
                  type: string
                  description: Required folder_path if upload_option is serverLocation
                  example: /opt/infoworks/lib/ingestion/drivers/custom_driver
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully created generic source type.
