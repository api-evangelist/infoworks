      - Security
      summary: bulk sync (add/update) ldap user by providing login attribute
      description: bulk sync (add/update) ldap user by providing login attribute
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                search_on:
                  type: string
                  example: email
                search_list:
                  type: array
                  items:
                    type: string
                    example: admin@infoworks.io
                should_update:
                  type: boolean
                  example: true
                  default: true
                should_add:
                  type: boolean
                  example: true
                  default: true
      responses:
        '200':
          description: bulk ldap users sync response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully synced ldap users
                  result:
                    type: object
                    properties:
                      new_users_count:
                        type: integer
                        example: 1
                      existing_user_count:
                        type: integer
                        example: 20
                      added:
                        type: array
                        items:
