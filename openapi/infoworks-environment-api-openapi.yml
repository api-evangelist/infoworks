                              - password_type
                              properties:
                                password_type:
                                  type: string
                                  enum:
                                  - infoworks_managed
                                  - secret_store
                                secret_id:
                                  type: string
                                  example: e77850ad5127a2d7dab870ff
                                password:
                                  type: string
                          https_enabled:
                            type: boolean
                            example: true
                          upload_option:
                            type: string
                            description: Required when https_enabled is true
                            enum:
                            - fileUpload
                            - serverLocation
                            example: fileUpload
