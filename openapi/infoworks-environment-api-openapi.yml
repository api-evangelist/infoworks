                      cluster_type:
                        type: string
                        enum:
                        - external
                        - internal
                        example: external
                      service_account_name:
                        type: string
                        example: kubernetes-service-account
                      authentication_mechanism:
                        type: string
                        enum:
                        - oauth_token
                        - client_key
                        example: oauth_token
                      api_url:
                        type: string
                        example: http://test.com
                      namespace:
                        type: string
                        example: kuberenetes-namespace
                      client_key:
                        type: object
                        description: Required when authentication_mechanism is client_key
                        required:
                        - upload_option
                        properties:
                          upload_option:
                            type: string
                            enum:
