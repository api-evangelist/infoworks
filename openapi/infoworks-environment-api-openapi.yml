openapi: 3.2.0
info:
  contact: {}
  title: Infoworks Rest API V3 Environment API
  version: '1.0'
  description: Infoworks Rest API V3
servers:
- url: '{protocol}://{host}:{port}/v3'
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost
    port:
      default: '3001'
tags:
- name: Environment
  description: ''
paths:
  /admin/environment:
    get:
      security:
      - BearerAuth: []
      operationId: EnvironmentsList
      tags:
      - Environment
      summary: Get the list of environments
      description: Retrieves the list of environments that are accessible to the user.
      parameters:
      - name: fetch_all
        in: query
        description: 'Use this parameter to retrieve the list of all environments. (Only for admin user).

          '
        schema:
          type: boolean
          default: null
        required: false
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - type: object
                - properties:
                    result:
                      type: array
                      items:
                        allOf:
                        - properties:
                            platform:
                              type: string
                              example: azure
                            name:
                              type: string
                              example: sample
                        - type: object
                          properties:
                            id:
                              type: string
                              example: e77850ad5127a2d7dab870ff
                        - properties:
                            state:
                              type: string
                              example: ready
                        - type: object
                          properties:
                            modified_at:
                              type: string
                              example: '2019-11-21T12:54:05.875Z'
                        - type: object
                          properties:
                            modified_by:
                              type: string
                              example: 6RkfybTRQQByEey3v
        '400':
          description: Request has invalid body or parameters.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10006
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10006
        '401':
          description: Authentication Failed. Please check your Credentials
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10005
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10005
        '403':
          description: Forbidden. User lacks access to specified resource.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10004
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10004
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10002
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10002
    post:
      security:
      - BearerAuth: []
      operationId: CreateEnvironment
      tags:
      - Environment
      summary: Create a new environment
      description: 'Creates or clones a environment.  To clone an existing environment, add the `resource_id_to_clone` query parameter. <br> **Note:** Cloning an environment will clone all its clusters and storages.

        '
      parameters:
      - name: resource_id_to_clone
        in: query
        description: 'Id of environment to be cloned.  Request body will be ignored when this parameter is passed.

          '
