      operationId: getDailyMeteringData
      tags:
      - Billing Metering Data
      summary: Get daily billing metering data
      description: Get daily billing metering data
      parameters:
      - name: start-date
        in: query
        description: Starting Date - timestamp
        schema:
          type: number
          example: 1578681000000
      - name: end-date
        in: query
        description: Ending Date - timestamp
        schema:
          type: number
          example: 1674325800000
      - name: sort_by
        in: query
        description: Sort result on field
        schema:
          type: string
      - name: order_by
        in: query
        description: order  ascending | descending
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - type: object
                  properties:
                    result:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            example: d57850ad5127a2d7dab870ff
                          usage_date:
                            type: integer
                            example: 1664389800000
                          average_cores:
                            type: integer
                            example: 0.5678520833333334
                          cumulative_average_cores:
                            type: integer
                            example: 0.3436064583333336
        '400':
          description: Request has invalid body or parameters.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Something went wrong
                    details:
                      type: object
                      properties: {}
                - type: object
                  properties:
                    iw_code:
                      type: string
                      example: IW10006
                    help:
                      type: string
                      example: http://api.infoworks.io/help/IW10006
