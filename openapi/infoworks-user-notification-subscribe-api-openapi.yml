        '200':
          description: List of User Notification Subscribe.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: successfully posted
                    result:
                      type: object
                      properties:
                        status:
                          type: number
                        result:
                          type: object
                          properties:
                            entity_id:
                              example: da2zd253f7417a1g274e6e01
                            entity_type:
                              type: string
                              example: source
                            users:
