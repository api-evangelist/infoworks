                                type: array
                                items:
                                  type: string
                                  example: 8247ad34f124512e
                              users:
                                type: array
                                items:
                                  type: string
                                  example: 8247ad34f124512e
                        - type: object
                          allOf:
                          - type: object
                            properties:
                              created_at:
                                type: string
                                example: '2019-11-21T12:54:05.875Z'
                          - type: object
                            properties:
                              created_by:
                                type: string
                                example: 6RkfybTRQQByEey3v
                          - type: object
                            properties:
                              modified_at:
                                type: string
                                example: '2019-11-21T12:54:05.875Z'
                          - type: object
                            properties:
                              modified_by:
                                type: string
                                example: 6RkfybTRQQByEey3v
                        - type: object
                          properties:
                            accessibleDomains:
                              type: array
                              items:
                                type: string
                                example: 3456234456cde12e
                        - type: object
                          properties:
                            accessiblePipelineExtensions:
                              type: array
                              items:
                                type: string
                                example: 7b606a6c4bc0688a99cc5f07
                        - type: object
                          properties:
                            environment:
                              type: object
                              properties:
                                id:
                                  type: string
                                  example: 63cd71df9f1c1e258c6e991b
                                name:
                                  type: string
                                  example: env_azure
                                compute_engine:
                                  type: string
                                  example: spark
                                platform:
                                  type: string
                                  example: databricks
                            ephemeral_compute:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    example: ephemeral_compute
                                  environment_id:
                                    type: string
                                    example: 63cd71df9f1c1e258c6e991b
                                  id:
                                    type: string
                                    example: 63cd71df9f1c1e258c6e991b
                            interactive_compute:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    example: interactive_compute
                                  environment_id:
                                    type: string
                                    example: 63cd71df9f1c1e258c6e991b
                                  id:
                                    type: string
                                    example: 63cd71df9f1c1e258c6e991b
                            storage:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    example: 63cd71df9f1c1e258c6e991b
                                  name:
                                    type: string
                                    example: storage
                                  environment_id:
                                    type: string
                                    example: 63cd71df9f1c1e258c6e991b
                                  description:
                                    type: string
                                    example: description for storage
                                  storage_type:
                                    type: string
                                    example: gcs
                                  storage_authentication:
                                    type: object
                                    properties:
                                      authentication_mechanism:
                                        type: string
                                        example: environment_service_credential
                                      scheme:
                                        type: string
                                        example: gs://
                                      bucket_name:
                                        type: string
                                        example: temp-bucket-xxx
        '400':
          description: Request has invalid body or parameters.
