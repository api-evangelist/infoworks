                              pattern: ^[1-12]{1}/[0-31]{1}/\d{4}$
                              type: string
                              description: Start time should be after current time.
                              format: date-month'/'date-mday'/'date-fullyear
                              example: 08/28/2023
                            start_hour:
                              type: integer
                              minimum: 0
                              maximum: 23
                              example: 14
                            start_min:
                              type: integer
                              minimum: 0
                              maximum: 59
                              example: 35
                            repeat_interval_unit:
                              type: string
                              enum:
                              - NEVER
                              - MINUTE
                              - HOUR
                              - DAY
                              - WEEK
                              - MONTH
