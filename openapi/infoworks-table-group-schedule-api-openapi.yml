          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - type: object
                  properties:
                    entity_id:
                      type: string
                      example: e77850ad5127a2d7dab870ff
                    schedule_type:
                      type: string
                      enum:
                      - workflow-build
                      - metadata_cleanup
                      - mongo-backup
                      - table-group-cdc
                      - table
                    schedule_username:
                      type: string
                      example: admin@infoworks.io
