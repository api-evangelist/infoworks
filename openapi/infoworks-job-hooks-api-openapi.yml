                properties:
                  message:
                    type: string
                    example: List of Job Hooks.
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 6fb069238f33b86d4262dcdc
                        execution_type:
                          type: string
                          example: PYTHON
                        name:
                          type: string
                          example: test
                        parameters:
                          type: string
                          example: ''
                        fail_job_if_hook_fails:
                          type: boolean
                          example: true
                        executable_file_name:
                          type: string
                          example: test.py
                        file_details:
                          type: array
                          items:
                            type: object
                            properties:
                              file_name:
                                type: string
                                example: terajdbc4.jar
                              file_path:
                                type: string
