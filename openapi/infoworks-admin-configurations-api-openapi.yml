          multipart/form-data:
            schema:
              type: object
              required:
              - authentication_type
              - full_name_attribute
              - email_attribute
              - role_attribute
              - role_separator
              - system_admin_roles
              - upload_option
              - acs_url
              - sp_entity_id
              - saml_type
              - is_active
