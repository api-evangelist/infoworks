                    example: true
              - type: object
                properties:
                  authentication_type:
                    type: string
                    enum:
                    - saml
                  full_name_attribute:
                    type: string
                    example: displayName
                  email_attribute:
                    type: string
                    example: mail
                  role_attribute:
                    type: string
                    example: memberOf
                  role_separator:
                    type: string
                    example: ','
                  system_admin_roles:
                    type: string
                    example: CN=admingroup,OU=ldaptest,DC=infoworks,DC=local
                  database_admin_roles:
                    type: string
                    example: CN=dbadmingroup,OU=ldaptest,DC=infoworks,DC=local
                  data_analyst_roles:
                    type: string
                    example: CN=analystgroup,OU=ldaptest,DC=infoworks,DC=local
                  data_modeller_roles:
                    type: string
                    example: CN=modellergroup,OU=ldaptest,DC=infoworks,DC=local
                  operational_analyst_roles:
                    type: string
                    example: CN=modellergroup,OU=ldaptest,DC=infoworks,DC=local
                  upload_option:
                    type: string
                    enum:
                    - fileUpload
                    - serverPath
                  acs_url:
                    type: string
                  sp_entity_id:
                    type: string
                  saml_type:
                    type: string
                    enum:
                    - OKTA
                    - AZURE
                  is_controlled_domain_mapping:
                    type: boolean
                    default: false
                  server_path:
                    type: string
                  file:
                    type: string
                    format: binary
                  domain_group_attribute:
                    type: string
                  domain_group_separator:
                    type: string
                  domain_group_mappings:
                    type: array
                    items:
                      type: object
                      properties:
                        domain_group_name_pattern:
