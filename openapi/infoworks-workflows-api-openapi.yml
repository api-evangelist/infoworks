    post:
      security:
      - BearerAuth: []
      summary: Get Workflows
      description: Get Workflows runs (This operation is only for `operations_analyst` user)
      tags:
      - Workflows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - date_range
              properties:
                date_range:
                  oneOf:
                  - type: object
                    required:
                    - type
                    - unit
                    - value
                    properties:
                      type:
                        type: string
                        example: last
                      unit:
                        type: string
                        enum:
                        - day
                        - hour
                        example: day
                      value:
                        type: integer
                        example: 6
                  - type: object
                    required:
                    - type
                    - start_date
                    - end_date
                    properties:
                      type:
                        type: string
                        example: custom
                      start_date:
                        type: integer
                        example: 1652355912000
                      end_date:
                        type: integer
                        example: 1652355912000
                order_by:
                  type: string
                  enum:
                  - asc
                  - desc
                  minLength: 1
                  example: asc
                  default: desc
                sort_by:
                  type: string
                  example: createdAt
                  minLength: 1
                offset:
                  type: integer
                  example: 5
                  minimum: 0
                limit:
                  type: integer
                  example: 10
                  default: 20
                  minimum: -1
                run_time_hour:
                  type: integer
                  example: 0.2
                  minimum: 0
                  default: Infinity
                domain_ids:
                  type: array
