openapi: 3.2.0
info:
  contact: {}
  title: Infoworks Rest API V3 Connections API
  version: '1.0'
  description: Infoworks Rest API V3
servers:
- url: '{protocol}://{host}:{port}/v3'
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost
    port:
      default: '3001'
tags:
- name: Connections
  description: ''
paths:
  /sources/{source_id}/configurations/connection:
    parameters:
    - name: Content-Type
      in: header
      description: Http content type
      required: true
      schema:
        type: string
    - name: source_id
      in: path
      description: Source Id.
      required: true
      schema:
        type: string
    get:
      security:
      - BearerAuth: []
      tags:
      - Connections
      summary: Get source connection details
      description: Get source connection details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Example Success Message
                - type: object
                  properties:
                    result:
                      properties:
                        enable_log_based_cdc:
                          type: boolean
                          example: false
                        driver_name:
                          type: string
                          example: oracle.jdbc.driver.OracleDriver
                        connection_url:
                          type: string
                          example: bc:oracle:thin:@0.0.0.0
                        username:
                          example: automation_db
                        password:
                          oneOf:
                          - type: string
                            minLength: 1
                            example:
                            - passw@rd_plain
                            - gIcfY/8lztYzmtrVX0dI/n+DD7RhkOqOtDJnIXXLydMYG1CgCX5fPn0gQkRhC3o=
                          - type: object
                            properties:
                              password_type:
                                type: string
                                enum:
                                - infoworks_managed
                              password:
                                type: string
                                minLength: 1
                                example:
                                - passw@rd_plain
                                - gIcfY/8lztYzmtrVX0dI/n+DD7RhkOqOtDJnIXXLydMYG1CgCX5fPn0gQkRhC3o=
                          - type: object
                            properties:
                              password_type:
                                type: string
                                enum:
                                - secret_store
                              secret_id:
                                type: string
                                example: e77850ad5127a2d7dab870ff
                        source_schema:
                          type: string
                          example: AUTOMATION_DB
                        connection_mode:
                          type: string
                          example: JDBC
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Something went wrong
                        detail:
                          type: object
                          properties: {}
                        help:
                          type: string
                          example: https://docs.infoworks.io/api/errors/IW1004
                        code:
                          type: string
                          example: IW1004
        '401':
          description: Unauthorized Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Something went wrong
                        detail:
                          type: object
                          properties: {}
                        help:
                          type: string
                          example: https://docs.infoworks.io/api/errors/IW1004
                        code:
                          type: string
                          example: IW1004
        '403':
          description: Forbidden Access
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Something went wrong
                        detail:
                          type: object
                          properties: {}
                        help:
                          type: string
                          example: https://docs.infoworks.io/api/errors/IW1004
                        code:
                          type: string
                          example: IW1004
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Something went wrong
                        detail:
                          type: object
                          properties: {}
                        help:
                          type: string
                          example: https://docs.infoworks.io/api/errors/IW1004
                        code:
                          type: string
                          example: IW1004
