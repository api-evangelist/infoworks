  /admin/metadata-cleanup/schedule:
    get:
      security:
      - BearerAuth: []
      operationId: getMetadataCleanupSchedule
      tags:
      - Admin Metadata Cleanup
      summary: Get Schedule of cleanup policy.
      description: Get Schedule of cleanup policy.
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      schedule_username:
                        type: string
                        example: 6RkfybTRQQByEey3v
                      schedule_type:
                        type: string
                        enum:
                        - metadata_cleanup
                      schedule_details:
                        oneOf:
                        - type: object
                          title: Generic Schedule
                          description: Generic schedule object
                          required:
                          - schedule_status
                          properties:
                            schedule_status:
                              type: string
                              enum:
                              - enabled
                              - disabled
                              example: enabled
                            start_date:
                              pattern: ^[1-12]{1}/[0-31]{1}/\d{4}$
                              type: string
                              description: Start time should be after current time.
                              format: date-month'/'date-mday'/'date-fullyear
                              example: 08/28/2023
                            start_hour:
                              type: integer
                              minimum: 0
                              maximum: 23
                              example: 14
                            start_min:
                              type: integer
                              minimum: 0
                              maximum: 59
                              example: 35
                            repeat_interval_unit:
                              type: string
                              enum:
                              - NEVER
                              - MINUTE
                              - HOUR
                              - DAY
                              - WEEK
                              - MONTH
                              default: NEVER
                              example: MONTH
                            repeat_interval_measure:
                              type: integer
                              minimum: 1
                            repeat_on_last_day:
                              type: boolean
                              description: '`specified_days` must be provided if `repeat_on_last_day` is false. Applicable for `repeat_interval_unit=MONTH`

                                '
                              default: false
                            specified_days:
                              type: array
                              description: 'Applicable when `repeat_interval_unit` is `WEEK` or `MONTH`.

                                '
                              minLength: 1
                              items:
                                type: integer
                                minimum: 0
                                maximum: 31
                              example:
                              - 1
                              - 17
                              - 31
                            ends:
                              type: boolean
                              description: '`end_date`, `end_hour`, `end_min` must be provided if `ends` is `true`.

                                '
                              default: false
                              example: true
                            end_date:
                              pattern: ^[1-12]{1}/[0-31]{1}/\d{4}$
                              type: string
                              description: End time should be after start time.
                              format: date-month'/'date-mday'/'date-fullyear
                              example: 08/28/2023
                            end_hour:
                              type: integer
                              minimum: 0
                              maximum: 23
                              example: 15
                            end_min:
                              type: integer
                              minimum: 0
                              maximum: 59
                              example: 38
                            is_custom_job:
                              type: boolean
                              description: '`custom_job_details` must be provided when `is_custom_job=true`. Applicable when `repeat_interval_unit` is `DAY`, `WEEK` or `MONTH`.

                                '
                              default: false
                            custom_job_details:
                              type: object
                              required:
                              - starts_daily_at
                              - ends_daily_at
                              - repeat_interval_measure
                              - repeat_interval_unit
                              properties:
                                starts_daily_at:
                                  pattern: ^{0-23}:[0-59]$
                                  type: string
                                  example: '12:40'
                                ends_daily_at:
