summary: >-
  Infoworks ships NO MCP server — not a hosted endpoint, not an npx/stdio package, not a community one.
  The tool list below is a CANDIDATE derived from the published OpenAPI so a future round (or the
  provider) has a starting shape. It is not a product and must not be read as one.
pointer_basis: >-
  NO `MCPServer` pointer is emitted in apis.yml. That check asserts the PROVIDER operates an agent
  surface; deriving a candidate does not make one exist. mcp_server_present is a genuine zero here.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    `mode: none` because nobody ships a server. No endpoint URL is guessed — a fabricated MCP path that
    happened to answer 200 would read as a verified agent surface, which is the worst possible artifact.
    If Infoworks were to build one it would be per-deployment, not vendor-hosted: the API lives at
    {protocol}://{host}:{port}/v3 inside the customer's own cloud, so the natural shape is a local-stdio
    server configured with the customer's host and refresh token.
