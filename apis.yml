aid: infoworks
name: Infoworks
description: >-
  Infoworks is an Enterprise Data Operations and Orchestration (EDO2) platform that automates data
  onboarding, preparation and operationalization onto Databricks, Snowflake, BigQuery, Synapse and
  Apache Spark. Unlike a multi-tenant SaaS, Infoworks is deployed into the customer's own cloud
  account (Kubernetes on AKS/EKS/GKE, or VM-based), so every deployment answers on its own host and
  the published contract carries a templated server. The product exposes the Infoworks REST API v3 —
  369 paths and 510 operations across 62 tag groupings (41 of them declared) covering sources, tables, table groups, topic and file
  mappings, domains, pipelines, pipeline groups, workflows, workflow versions, jobs, environments,
  clusters, secrets, service authentication, users, admin operations and metrics — plus a first-party
  Python SDK on PyPI. Infoworks was acquired by Uniphore in 2024 and is sold as InfoWorks inside the
  Uniphore Business AI platform; the corporate site now redirects to uniphore.com while the product
  documentation, support desk and API reference remain on infoworks.io.
