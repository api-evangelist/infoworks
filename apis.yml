apis:
- name: Infoworks REST API v3
  description: >-
    The Infoworks v3 REST API — 369 paths and 510 operations across 62 tag groupings — for onboarding sources,
    crawling and ingesting tables, building pipelines and pipeline groups, scheduling and running
    workflows and jobs, and administering environments, clusters, secrets, service authentication,
    subscribers, job hooks and users. Authentication is a short-lived JWT bearer token minted from
    either HTTP Basic (username:password) or a long-lived refresh token copied from the Infoworks UI.
    The server block is templated ({protocol}://{host}:{port}/v3) because Infoworks runs in the
    customer's own cloud, not on a vendor-operated host.
  humanURL: https://docs.infoworks.io/infoworks-rest-api-v3/ref
  baseURL: https://{host}:{port}/v3
  x-base-url: >-
    NO FIXED BASE URL EXISTS, and this is a product fact rather than a gap in our research. Infoworks is
    licensed software deployed into the customer's own cloud account, so every deployment answers on its
    own host. The provider's own OpenAPI declares a fully templated server ({protocol}://{host}:{port}/v3
    with defaults http/localhost/3001, the in-cluster service address) and the official Python SDK is
    initialized with protocol/host/port supplied by the operator. repair-api-bases.py returns
    `no-usable-base` for exactly this reason; nothing is guessed from the domain to fill it.
