    serves the product page at uniphore.com/infoworks/ and release note 6.1.3.2 records the Infoworks
    logo being replaced with the Uniphore logo in the product UI. The certifications below are
    Uniphore's corporate program, and the trust center does not name InfoWorks specifically.
